<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALMANVM — EL MEJOR DJ</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: -30%;
      background:
        radial-gradient(circle at 20% 30%, rgba(107, 0, 255, .45), transparent 28%),
        radial-gradient(circle at 80% 70%, rgba(0, 200, 255, .32), transparent 30%),
        radial-gradient(circle at 60% 20%, rgba(255, 0, 115, .26), transparent 26%);
      filter: blur(40px);
      animation: move 10s ease-in-out infinite alternate;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
    }
    .wrap {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 24px;
    }
    .logo {
      font-size: clamp(54px, 13vw, 170px);
      font-weight: 900;
      letter-spacing: .08em;
      line-height: .9;
      text-transform: uppercase;
      text-shadow:
        0 0 18px rgba(255,255,255,.12),
        0 0 46px rgba(119, 0, 255, .35);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .sub {
      margin-top: 18px;
      font-size: clamp(20px, 4.2vw, 52px);
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: .92;
    }
    .tag {
      display: inline-block;
      margin-top: 26px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .72;
    }
    @keyframes move {
      from { transform: translate3d(-2%, -2%, 0) scale(1); }
      to   { transform: translate3d(4%, 3%, 0) scale(1.08); }
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <main class="wrap">
    <div class="logo">ALMANVM</div>
    <div class="sub">EL MEJOR DJ</div>
    <div class="tag">URBAN · REGGAETÓN · LIVE MASHUPS</div>
  </main>
</body>
</html>
